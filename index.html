<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/argot-icon.svg" />
    <title>argot — train your fingers to think in vim</title>
    <meta name="description" content="train your fingers to think in vim." />
    <script>
      // Paint the saved theme from the start; initTheme checks it once the app loads.
      try {
        const saved = localStorage.getItem("argot:theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
